<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Chess | Premium</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        /* TEMAS GLOBAIS E VARIÁVEIS */
        :root {
            --bg: #0a0a0c; --surface: rgba(18, 18, 22, 0.85); --text: #ffffff; --text-muted: #888888;
            --neon-cyan: #00f3ff; --neon-purple: #b800ff; --danger: #ff3333;
            --border: rgba(255,255,255,0.08); --glass-border: rgba(255,255,255,0.15);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            --board-light: #2a2a30; --board-dark: #101014;
        }

        body.light-mode {
            --bg: #f0f2f5; --surface: rgba(255, 255, 255, 0.85); --text: #1a1a1a; --text-muted: #666666;
            --neon-cyan: #0088cc; --neon-purple: #8a2be2; --danger: #e60000;
            --border: rgba(0,0,0,0.1); --glass-border: rgba(0,0,0,0.1);
            --shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; transition: background-color 0.3s, color 0.3s; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }

        /* MENU */
        #menu-screen, #waiting-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, var(--surface) 0%, var(--bg) 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        #waiting-screen { display: none; }
        #menu-screen h1 { font-size: 3.5rem; margin-bottom: 1rem; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 4px; font-weight: 800; text-shadow: 0 0 20px rgba(0, 243, 255, 0.2); text-align: center; }
        
        /* RANK CARD */
        .rank-card { background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 15px 25px; border-radius: 16px; text-align: center; margin-bottom: 25px; width: 320px; box-shadow: var(--shadow); }
        .rank-name { font-size: 1.6rem; font-weight: 800; color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0, 243, 255, 0.3); margin-bottom: 5px; }
        .rank-points { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; }
        .rank-bar-bg { width: 100%; height: 10px; background: rgba(128, 128, 128, 0.2); border-radius: 5px; margin-top: 12px; overflow: hidden; }
        .rank-bar-fill { height: 100%; background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple)); width: 0%; transition: width 0.5s ease; }

        .menu-btn { background: var(--surface); backdrop-filter: blur(10px); border: 2px solid var(--neon-cyan); color: var(--text); padding: 1.2rem 2rem; font-size: 1.1rem; border-radius: 12px; margin: 0.5rem; width: 320px; cursor: pointer; transition: all 0.3s; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 12px; box-shadow: var(--shadow); }
        .menu-btn:hover { background: rgba(0, 243, 255, 0.1); box-shadow: 0 0 20px rgba(0, 243, 255, 0.4); transform: translateY(-3px); }
        .menu-btn.purple { border-color: var(--neon-purple); }
        .menu-btn.purple:hover { background: rgba(184, 0, 255, 0.1); box-shadow: 0 0 20px rgba(184, 0, 255, 0.4); }
        
        .spinner-box { width: 160px; height: 160px; position: relative; margin-bottom: 40px; display: flex; justify-content: center; align-items: center; }
        .spinner-box::before { content: ''; position: absolute; width: 100%; height: 100%; border-radius: 20px; border: 3px solid transparent; border-top-color: var(--neon-cyan); border-bottom-color: var(--neon-purple); animation: spin 2s linear infinite; }
        .spinner-box::after { content: '♟'; font-size: 70px; color: var(--neon-cyan); animation: pulse 1.5s ease-in-out infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
        .waiting-text { font-size: 1.4rem; margin-bottom: 10px; font-weight: 600; }
        .waiting-sub { font-size: 1rem; color: var(--text-muted); margin-bottom: 30px; }
        .btn-cancel { background: transparent; border: 2px solid var(--danger); color: var(--danger); padding: 12px 40px; border-radius: 30px; font-weight: 600; cursor: pointer; }

        /* JOGO */
        #game-container { display: none; flex-direction: column; align-items: center; width: 100%; max-width: 600px; padding: 10px; height: 100vh; justify-content: space-between; }
        .top-bar { width: 95%; display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; }
        .player-info { display: flex; align-items: center; gap: 10px; background: var(--surface); backdrop-filter: blur(10px); padding: 8px 20px; border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); }
        .turn-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--text-muted); }
        .turn-dot.active { background: var(--neon-cyan); box-shadow: 0 0 10px var(--neon-cyan); }
        .title-icon { font-size: 1.8rem; color: var(--neon-cyan); text-shadow: 0 0 10px var(--neon-cyan); }

        #board-wrapper { width: 95vw; max-width: 500px; aspect-ratio: 1 / 1; position: relative; margin: auto 0; box-shadow: var(--shadow); border-radius: 12px; overflow: hidden; border: 1px solid var(--glass-border); }
        #board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }
        
        .square { display: flex; justify-content: center; align-items: center; font-size: 11vw; cursor: pointer; position: relative; line-height: 1; }
        @media (min-width: 500px) { .square { font-size: 55px; } }
        .square.light { background-color: var(--board-light); }
        .square.dark { background-color: var(--board-dark); }
        
        .piece-w { color: #ffffff; text-shadow: 0 0 3px #000, 0 0 6px #000, 0 0 2px #000; }
        .piece-b { color: #000000; text-shadow: 0 0 3px #fff, 0 0 6px #fff, 0 0 2px #fff; }
        body.light-mode .piece-w { color: #fff; text-shadow: 0 0 3px #555, 0 0 5px #555; }
        body.light-mode .piece-b { color: #111; text-shadow: 0 0 3px #ccc, 0 0 5px #ccc; }

        .highlight::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 35%; height: 35%; background-color: var(--neon-cyan); border-radius: 50%; opacity: 0.8; pointer-events: none; }
        .capture-highlight { box-shadow: inset 0 0 0 4px var(--neon-cyan); }
        .last-move { background-color: rgba(184, 0, 255, 0.4) !important; }
        .in-check { background-color: rgba(255, 51, 51, 0.8) !important; animation: pulse-red 1s infinite; }
        @keyframes pulse-red { 0% { box-shadow: inset 0 0 0 0 rgba(255, 51, 51, 0.8); } 70% { box-shadow: inset 0 0 0 15px rgba(255, 51, 51, 0); } 100% { box-shadow: inset 0 0 0 0 rgba(255, 51, 51, 0); } }

        .bottom-bar { width: 95%; display: flex; justify-content: space-between; padding: 10px 0; gap: 10px; }
        .btn-ctrl { flex: 1; background: var(--surface); backdrop-filter: blur(10px); border: 1px solid var(--border); color: var(--text); padding: 15px 5px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); }
        .btn-ctrl:active { transform: scale(0.95); }

        /* MODAIS */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-box { background: var(--surface); backdrop-filter: blur(15px); padding: 30px; border-radius: 20px; border: 1px solid var(--glass-border); display: flex; flex-direction: column; gap: 20px; text-align: center; width: 90%; max-width: 380px; box-shadow: var(--shadow); }
        .modal-box h2 { color: var(--neon-cyan); font-size: 1.6rem; }
        .modal-box p { color: var(--text-muted); font-size: 1rem; line-height: 1.4; }
        .modal-btns { display: flex; gap: 15px; margin-top: 10px; }
        .modal-btn { flex: 1; padding: 14px; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; font-size: 1rem; }
        .modal-btn.yes { background: var(--neon-cyan); color: #000; }
        .modal-btn.no { background: transparent; border: 2px solid var(--text-muted); color: var(--text-muted); }
        .modal-btn.danger { background: var(--danger); color: #fff; }

        /* PROMOÇÃO E HISTÓRICO */
        .promo-content { background: var(--surface); padding: 30px; border-radius: 20px; border: 1px solid var(--neon-cyan); display: flex; gap: 20px; box-shadow: var(--shadow); }
        .promo-piece { font-size: 50px; cursor: pointer; color: var(--text); padding: 10px; transition: transform 0.2s; }
        .promo-piece:hover { transform: scale(1.2); color: var(--neon-cyan); }

        #history-panel { position: fixed; top: 0; right: -320px; width: 280px; height: 100%; background: var(--surface); backdrop-filter: blur(15px); border-left: 1px solid var(--border); z-index: 500; transition: right 0.3s ease; padding: 25px; overflow-y: auto; box-shadow: var(--shadow); display: flex; flex-direction: column; }
        #history-panel.open { right: 0; }
        .move-list { list-style: none; font-size: 1rem; color: var(--text-muted); flex: 1; overflow-y: auto; }
        .move-list li { padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
        .move-list span { color: var(--text); font-weight: 600; }

        /* BOTÃO ADMIN (Fundo da Barra Lateral) */
        .admin-trigger { margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border); text-align: center; color: var(--text-muted); font-size: 0.8rem; cursor: pointer; transition: color 0.2s; }
        .admin-trigger:hover { color: var(--danger); }

        /* DEFINIÇÕES E ADMIN */
        .settings-content { max-height: 85vh; overflow-y: auto; text-align: left; }
        .settings-content h2 { color: var(--neon-cyan); text-align: center; margin-bottom: 15px; }
        .setting-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .setting-group label { color: var(--text); font-size: 0.95rem; font-weight: 600; }
        .setting-group select, .setting-group input[type="text"], .setting-group input[type="number"] { padding: 12px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 8px; outline: none; font-family: 'Inter', sans-serif; font-size: 0.95rem; }

        /* VITÓRIA */
        #fireworks-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .victory-content { background: var(--surface); backdrop-filter: blur(15px); padding: 40px 20px; border-radius: 24px; border: 2px solid var(--neon-cyan); text-align: center; z-index: 1; width: 90%; max-width: 400px; box-shadow: var(--shadow); }
        .victory-title { font-size: 3rem; margin-bottom: 10px; background: linear-gradient(90deg, #fff, var(--neon-cyan)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800; }
        .victory-subtitle { font-size: 1.3rem; color: var(--text-muted); margin-bottom: 10px; }
        .victory-pts { font-size: 1.5rem; font-weight: bold; color: var(--neon-purple); margin-bottom: 30px; display: none; }
        .victory-btn { background: var(--neon-cyan); color: #000; border: none; padding: 16px 40px; font-size: 1.1rem; font-weight: bold; border-radius: 12px; cursor: pointer; width: 100%; transition: transform 0.2s; }
        .victory-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div id="menu-screen">
        <h1>NEON CHESS</h1>
        <div class="rank-card">
            <div class="rank-name" id="ui-rank">Bronze</div>
            <div class="rank-points" id="ui-points">0 / 100.000 Pontos</div>
            <div class="rank-bar-bg"><div class="rank-bar-fill" id="ui-rank-bar"></div></div>
        </div>
        <button class="menu-btn" onclick="startGame('online')">🌐 Jogar Online (Ranked)</button>
        <button class="menu-btn purple" onclick="startGame('pvc')">🤖 Jogar vs IA (Casual)</button>
        <button class="menu-btn" style="border-color: #888; margin-top: 20px;" onclick="openSettings()">⚙️ Definições</button>
    </div>

    <div id="waiting-screen">
        <div class="spinner-box"></div>
        <div class="waiting-text" id="waiting-status">A procurar oponente...</div>
        <div class="waiting-sub">Abre outra aba e clica em "Online".</div>
        <button class="btn-cancel" onclick="cancelMatchmaking()">Cancelar</button>
    </div>

    <div id="game-container">
        <div class="top-bar">
            <span class="title-icon">♞</span>
            <div class="player-info">
                <div class="turn-dot" id="turn-dot"></div>
                <span id="turn-text">Vez das Brancas</span>
            </div>
            <div style="display: flex; gap: 5px;">
                <button class="btn-ctrl" style="padding: 8px 12px; flex: none;" onclick="openSettings()">⚙️</button>
                <button class="btn-ctrl" style="padding: 8px 12px; flex: none;" onclick="toggleHistory()">📜</button>
            </div>
        </div>
        
        <div id="board-wrapper">
            <div id="board"></div>
        </div>
        
        <div class="bottom-bar">
            <button class="btn-ctrl" onclick="askNewGame()">Novo Jogo</button>
            <button class="btn-ctrl" onclick="askResign()" style="color: var(--danger); border-color: rgba(255,51,51,0.3);">Desistir</button>
            <button class="btn-ctrl" onclick="flipBoard()">Rodar</button>
        </div>
    </div>

    <!-- CONFIRMAÇÃO -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-box">
            <h2 id="confirm-title">Título</h2>
            <p id="confirm-msg">Mensagem</p>
            <div class="modal-btns">
                <button class="modal-btn no" onclick="closeConfirm(false)">Cancelar</button>
                <button class="modal-btn yes" id="confirm-btn-yes" onclick="closeConfirm(true)">Sim</button>
            </div>
        </div>
    </div>

    <!-- PAINEL DE ADMIN (DONO) -->
    <div class="modal-overlay" id="admin-modal">
        <div class="modal-box">
            <h2 style="color: var(--neon-purple);">👑 Painel do Dono</h2>
            <p>Adicionar pontos a um jogador</p>
            <div class="setting-group" style="text-align: left;">
                <label>Nome do Jogador:</label>
                <input type="text" id="admin-player-name" placeholder="Ex: Jogador1">
            </div>
            <div class="setting-group" style="text-align: left;">
                <label>Pontos a Adicionar:</label>
                <input type="number" id="admin-points" placeholder="Ex: 5000" min="1" max="100000">
            </div>
            <div class="modal-btns">
                <button class="modal-btn no" onclick="closeAdmin()">Fechar</button>
                <button class="modal-btn yes" style="background: var(--neon-purple); color: #fff;" onclick="addPointsAdmin()">Adicionar</button>
            </div>
        </div>
    </div>

    <!-- PROMOÇÃO -->
    <div class="modal-overlay" id="promo-modal">
        <div class="promo-content">
            <div class="promo-piece" onclick="selectPromotion('q')">♕</div>
            <div class="promo-piece" onclick="selectPromotion('r')">♖</div>
            <div class="promo-piece" onclick="selectPromotion('b')">♗</div>
            <div class="promo-piece" onclick="selectPromotion('n')">♘</div>
        </div>
    </div>

    <!-- HISTÓRICO E BARRA LATERAL -->
    <div id="history-panel">
        <h3 style="margin-bottom: 15px; color: var(--neon-cyan); font-weight: 600;">Movimentos</h3>
        <ul class="move-list" id="move-list"></ul>
        <!-- BOTÃO SECRETO DO DONO -->
        <div class="admin-trigger" onclick="requestAdmin()">👑 Painel do Dono</div>
    </div>

    <!-- DEFINIÇÕES -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal-box settings-content">
            <h2>Personalização</h2>
            <div class="setting-group">
                <label>Interface do Site:</label>
                <select id="ui-theme" onchange="applyTheme()">
                    <option value="dark">Escuro (Cyberpunk)</option>
                    <option value="light">Claro (Clássico)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Estilo das Peças:</label>
                <select id="piece-style" onchange="applyTheme()">
                    <option value="classic">Unicode Clássico (♔)</option>
                    <option value="modern">Neon Sólido (♚)</option>
                    <option value="outline">Contorno (♔)</option>
                    <option value="letters">Letras (K, Q, R)</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Cor do Tabuleiro:</label>
                <select id="board-style" onchange="applyTheme()">
                    <option value="dark">Neon Escuro</option>
                    <option value="classic">Madeira Clássica</option>
                    <option value="cyberpunk">Azul Cyberpunk</option>
                    <option value="emerald">Esmeralda</option>
                    <option value="purple">Roxo Místico</option>
                    <option value="mono">Monocromático</option>
                </select>
            </div>
            <button class="victory-btn" style="margin-top: 10px;" onclick="closeSettings()">Voltar ao Jogo</button>
        </div>
    </div>

    <!-- VITÓRIA -->
    <div class="modal-overlay" id="victory-screen">
        <canvas id="fireworks-canvas"></canvas>
        <div class="victory-content">
            <div class="victory-title" id="victory-title">FIM DE JOGO</div>
            <div class="victory-subtitle" id="victory-subtitle">Vencedor: Brancas</div>
            <div class="victory-pts" id="victory-pts">+200 Pontos</div>
            <button class="victory-btn" onclick="closeVictory()">Voltar ao Menu</button>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO DO DONO ---
        const OWNER_PASSWORD = "leo2024"; 

        // --- SISTEMA DE RANKS ---
        const RANKS = [
            { name: 'Bronze', min: 0, max: 1000 },
            { name: 'Prata', min: 1001, max: 5000 },
            { name: 'Ouro', min: 5001, max: 15000 },
            { name: 'Platina', min: 15001, max: 30000 },
            { name: 'Diamante', min: 30001, max: 60000 },
            { name: 'Mestre', min: 60001, max: 99999 },
            { name: 'Lenda (Leo)', min: 100000, max: 100000 }
        ];

        function getPlayerPoints() { return parseInt(localStorage.getItem('playerPoints') || '0'); }
        function setPlayerPoints(pts) { 
            pts = Math.max(0, Math.min(100000, pts));
            localStorage.setItem('playerPoints', pts); 
            updateRankUI();
        }

        function updateRankUI() {
            const pts = getPlayerPoints();
            let rank = RANKS[0];
            for (let i = RANKS.length - 1; i >= 0; i--) {
                if (pts >= RANKS[i].min) { rank = RANKS[i]; break; }
            }
            document.getElementById('ui-rank').innerText = rank.name;
            document.getElementById('ui-points').innerText = `${pts} / 100.000 Pontos`;
            
            let percent = (pts / 100000) * 100;
            if (rank.name === 'Lenda (Leo)') percent = 100;
            document.getElementById('ui-rank-bar').style.width = percent + '%';
        }

        // --- ADMIN LOGIC ---
        function requestAdmin() {
            const pwd = prompt("Insira a palavra-passe de Dono:");
            if (pwd === OWNER_PASSWORD) {
                document.getElementById('admin-modal').style.display = 'flex';
            } else if (pwd !== null) {
                alert("Palavra-passe incorreta!");
            }
        }

        function closeAdmin() { document.getElementById('admin-modal').style.display = 'none'; }

        function addPointsAdmin() {
            const playerName = document.getElementById('admin-player-name').value || "Local Player";
            const ptsToAdd = parseInt(document.getElementById('admin-points').value);
            
            if (isNaN(ptsToAdd) || ptsToAdd <= 0) {
                alert("Insira um número válido de pontos.");
                return;
            }
            
            let current = getPlayerPoints();
            setPlayerPoints(current + ptsToAdd);
            
            alert(`Sucesso! Foram adicionados ${ptsToAdd} pontos ao jogador ${playerName}.`);
            closeAdmin();
            document.getElementById('admin-points').value = '';
            document.getElementById('admin-player-name').value = '';
        }

        // --- SISTEMA DE CONFIRMAÇÃO ---
        let confirmCallback = null;
        function showConfirm(title, msg, isDanger, callback) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-msg').innerText = msg;
            const btn = document.getElementById('confirm-btn-yes');
            btn.className = `modal-btn ${isDanger ? 'danger' : 'yes'}`;
            document.getElementById('confirm-modal').style.display = 'flex';
            confirmCallback = callback;
        }
        function closeConfirm(isOk) {
            document.getElementById('confirm-modal').style.display = 'none';
            if (confirmCallback) { if (isOk) confirmCallback(); confirmCallback = null; }
        }

        // --- TEMAS ---
        const THEMES = {
            pieces: {
                classic: { 'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙', 'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟' },
                modern: { 'K': '♚', 'Q': '♛', 'R': '♜', 'B': '♝', 'N': '♞', 'P': '♟', 'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟' },
                outline: { 'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙', 'k': '♔', 'q': '♕', 'r': '♖', 'b': '♗', 'n': '♘', 'p': '♙' },
                letters: { 'K': 'K', 'Q': 'Q', 'R': 'R', 'B': 'B', 'N': 'N', 'P': 'P', 'k': 'k', 'q': 'q', 'r': 'r', 'b': 'b', 'n': 'n', 'p': 'p' }
            },
            boards: {
                dark: { light: '#2a2a30', dark: '#101014' },
                classic: { light: '#f0d9b5', dark: '#b58863' },
                cyberpunk: { light: '#2b3b52', dark: '#0f1620' },
                emerald: { light: '#e0f2f1', dark: '#4db6ac' },
                purple: { light: '#f3e5f5', dark: '#ab47bc' },
                mono: { light: '#dcdcdc', dark: '#666666' }
            }
        };

        function loadSettings() {
            document.getElementById('ui-theme').value = localStorage.getItem('uiTheme') || 'dark';
            document.getElementById('piece-style').value = localStorage.getItem('pieceStyle') || 'classic';
            document.getElementById('board-style').value = localStorage.getItem('boardStyle') || 'dark';
            applyTheme();
        }

        function applyTheme() {
            const uiStyle = document.getElementById('ui-theme').value;
            const pStyle = document.getElementById('piece-style').value;
            const bStyle = document.getElementById('board-style').value;
            
            localStorage.setItem('uiTheme', uiStyle);
            localStorage.setItem('pieceStyle', pStyle);
            localStorage.setItem('boardStyle', bStyle);

            if (uiStyle === 'light') document.body.classList.add('light-mode');
            else document.body.classList.remove('light-mode');

            document.documentElement.style.setProperty('--board-light', THEMES.boards[bStyle].light);
            document.documentElement.style.setProperty('--board-dark', THEMES.boards[bStyle].dark);
            
            if (typeof renderBoard === 'function' && board.length > 0) renderBoard();
        }

        function getPieceChar(p) { return THEMES.pieces[localStorage.getItem('pieceStyle') || 'classic'][p] || p; }
        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

        // --- ESTADO DO JOGO ---
        let channel = null, myOnlineColor = null, isOnlineGame = false, isWaitingForMatch = false;
        let matchStartTime = 0;

        const boardEl = document.getElementById('board');
        const turnText = document.getElementById('turn-text');
        const turnDot = document.getElementById('turn-dot');
        const moveListEl = document.getElementById('move-list');
        const victoryScreen = document.getElementById('victory-screen');
        const victoryTitle = document.getElementById('victory-title');
        const victorySubtitle = document.getElementById('victory-subtitle');
        const victoryPts = document.getElementById('victory-pts');

        let board = new Array(64).fill(null);
        let turn = 'w', selectedSquare = null, legalMovesForSelected = [], history = [], algebraicHistory = [], moveNumber = 1, isFlipped = false, gameMode = 'pvc', isGameOver = false, enPassantTarget = null, pendingPromotion = null, animationId = null;

        const initialBoard = [
            'r','n','b','q','k','b','n','r', 'p','p','p','p','p','p','p','p',
            null,null,null,null,null,null,null,null, null,null,null,null,null,null,null,null,
            null,null,null,null,null,null,null,null, null,null,null,null,null,null,null,null,
            'P','P','P','P','P','P','P','P', 'R','N','B','Q','K','B','N','R'
        ];
        const pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 900 };

        function initBoard() {
            board = [...initialBoard]; turn = 'w'; selectedSquare = null; legalMovesForSelected = []; history = []; algebraicHistory = []; moveNumber = 1; enPassantTarget = null; isGameOver = false;
            matchStartTime = Date.now();
            moveListEl.innerHTML = ''; victoryScreen.style.display = 'none'; victoryPts.style.display = 'none';
            if (animationId) cancelAnimationFrame(animationId);
            updateUI(); renderBoard();
        }

        function startGame(mode) {
            gameMode = mode;
            document.getElementById('menu-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('menu-screen').style.display = 'none';
                if (mode === 'online') {
                    isOnlineGame = true; document.getElementById('waiting-screen').style.display = 'flex'; startOnlineMatchmaking();
                } else {
                    isOnlineGame = false; document.getElementById('game-container').style.display = 'flex'; initBoard();
                }
            }, 300);
        }

        // --- REDE (ONLINE LOCAL) ---
        function startOnlineMatchmaking() {
            isWaitingForMatch = true; channel = new BroadcastChannel('neon_chess_ranked');
            channel.postMessage({ type: 'searching' });
            channel.onmessage = (event) => {
                const data = event.data;
                if (data.type === 'searching' && isWaitingForMatch) {
                    myOnlineColor = 'white'; isWaitingForMatch = false;
                    channel.postMessage({ type: 'match_found', color: 'black' }); startOnlineBoard();
                } else if (data.type === 'match_found' && isWaitingForMatch) {
                    myOnlineColor = data.color; isWaitingForMatch = false; startOnlineBoard();
                } else if (data.type === 'move' && isOnlineGame) {
                    applyOnlineMove(data.move);
                } else if (data.type === 'reset' && isOnlineGame) {
                    initBoard();
                } else if (data.type === 'resign' && isOnlineGame) {
                    isGameOver = true; showVictory(`Oponente desistiu. Vencedor: Tu`, true);
                }
            };
        }

        function startOnlineBoard() {
            document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            if (myOnlineColor === 'black') isFlipped = true;
            initBoard();
        }

        function cancelMatchmaking() {
            if (channel) { channel.close(); channel = null; }
            isWaitingForMatch = false; document.getElementById('waiting-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'flex'; document.getElementById('menu-screen').style.opacity = '1';
        }

        function applyOnlineMove(move) {
            board[move.to] = move.piece; board[move.from] = null;
            if (move.isEnPassant) board[move.to + (move.piece === 'P' ? 8 : -8)] = null;
            enPassantTarget = move.enPassantTarget; turn = turn === 'w' ? 'b' : 'w';
            selectedSquare = null; legalMovesForSelected = []; renderBoard(); checkGameState();
        }

        // --- MOTOR DE XADREZ ---
        function getPseudoMoves(pos, piece, cb, ep) {
            let moves = []; const row = Math.floor(pos / 8), col = pos % 8, isW = piece === piece.toUpperCase();
            const add = (r, c) => {
                if (r >= 0 && r < 8 && c >= 0 && c < 8) {
                    const tPos = r * 8 + c, tPiece = cb[tPos];
                    if (!tPiece || (isW ? tPiece === tPiece.toLowerCase() : tPiece === tPiece.toUpperCase())) moves.push({ from: pos, to: tPos, piece, captured: tPiece });
                }
            };
            const p = piece.toLowerCase();
            if (p === 'p') {
                const dir = isW ? -1 : 1, start = isW ? 6 : 1;
                if (row + dir >= 0 && row + dir < 8 && !cb[(row + dir) * 8 + col]) {
                    moves.push({ from: pos, to: (row + dir) * 8 + col, piece });
                    if (row === start && !cb[(row + 2 * dir) * 8 + col]) moves.push({ from: pos, to: (row + 2 * dir) * 8 + col, piece });
                }
                for (const dc of [-1, 1]) {
                    if (col + dc >= 0 && col + dc < 8) {
                        const tPos = (row + dir) * 8 + (col + dc);
                        if (row + dir >= 0 && row + dir < 8) {
                            const tPiece = cb[tPos];
                            if (tPiece && (isW ? tPiece === tPiece.toLowerCase() : tPiece === tPiece.toUpperCase())) moves.push({ from: pos, to: tPos, piece, captured: tPiece });
                            if (tPos === ep) moves.push({ from: pos, to: tPos, piece, captured: isW ? 'p' : 'P', isEnPassant: true });
                        }
                    }
                }
            } else if (p === 'n') { [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(([dr, dc]) => add(row + dr, col + dc)); }
            else if (p === 'b' || p === 'r' || p === 'q') {
                const dirs = [];
                if (p === 'b' || p === 'q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]);
                if (p === 'r' || p === 'q') dirs.push([-1,0],[1,0],[0,-1],[0,1]);
                for (let [dr, dc] of dirs) {
                    let r = row + dr, c = col + dc;
                    while (r >= 0 && r < 8 && c >= 0 && c < 8) {
                        const tPos = r * 8 + c, tPiece = cb[tPos];
                        if (!tPiece) moves.push({ from: pos, to: tPos, piece });
                        else {
                            if (isW ? tPiece === tPiece.toLowerCase() : tPiece === tPiece.toUpperCase()) moves.push({ from: pos, to: tPos, piece, captured: tPiece });
                            break;
                        }
                        r += dr; c += dc;
                    }
                }
            } else if (p === 'k') { for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) if (dr !== 0 || dc !== 0) add(row + dr, col + dc); }
            return moves;
        }

        function getLegalMoves(pos, piece, cb, ep) {
            return getPseudoMoves(pos, piece, cb, ep).filter(m => {
                const tb = [...cb]; tb[m.to] = piece; tb[m.from] = null;
                if (m.isEnPassant) tb[piece === piece.toUpperCase() ? m.to + 8 : m.to - 8] = null;
                return !isCheck(piece === piece.toUpperCase() ? 'w' : 'b', tb);
            });
        }

        function isCheck(color, cb) {
            const k = color === 'w' ? 'K' : 'k', pos = cb.indexOf(k);
            if (pos === -1) return false;
            const e = color === 'w' ? 'b' : 'w';
            for (let i = 0; i < 64; i++) {
                const p = cb[i];
                if (p && (e === 'w' ? p === p.toUpperCase() : p === p.toLowerCase())) {
                    if (getPseudoMoves(i, p, cb, null).some(m => m.to === pos)) return true;
                }
            }
            return false;
        }

        function checkGameState() {
            let hasMoves = false;
            for (let i = 0; i < 64; i++) {
                const p = board[i];
                if (p && (turn === 'w' ? p === p.toUpperCase() : p === p.toLowerCase())) {
                    if (getLegalMoves(i, p, board, enPassantTarget).length > 0) { hasMoves = true; break; }
                }
            }
            if (!hasMoves) {
                isGameOver = true;
                const winWhite = turn === 'b';
                let isWin = false;
                if (isOnlineGame) isWin = (winWhite && myOnlineColor === 'white') || (!winWhite && myOnlineColor === 'black');
                else isWin = winWhite; 
                showVictory(isCheck(turn, board) ? `Xeque-Mate! Vencedor: ${turn === 'w' ? 'Pretas' : 'Brancas'}` : "Empate (Afogamento)", isWin);
            }
            updateUI();
        }

        function updateUI() {
            if (!isOnlineGame || myOnlineColor === turn) turnText.innerText = isGameOver ? "Fim de Jogo" : `Vez das ${turn === 'w' ? 'Brancas' : 'Pretas'}`;
            else turnText.innerText = `Vez das ${turn === 'w' ? 'Brancas' : 'Pretas'} (Inimigo)`;
            turnDot.classList.toggle('active', turn === 'w');
        }

        function renderBoard() {
            boardEl.innerHTML = '';
            const inCheck = !isGameOver && isCheck(turn, board);
            const kPos = board.indexOf(turn === 'w' ? 'K' : 'k');
            for (let i = 0; i < 64; i++) {
                const act = isFlipped ? (63 - i) : i, r = Math.floor(act / 8), c = act % 8;
                const sq = document.createElement('div');
                sq.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`; sq.dataset.index = act;
                
                if (selectedSquare === act) sq.style.backgroundColor = 'rgba(0, 243, 255, 0.6)';
                if (algebraicHistory.length > 0) {
                    const last = algebraicHistory[algebraicHistory.length-1];
                    if (last && (last.from === act || last.to === act)) sq.classList.add('last-move');
                }
                const move = legalMovesForSelected.find(m => m.to === act);
                if (move) sq.classList.add(move.captured ? 'capture-highlight' : 'highlight');
                if (inCheck && act === kPos) sq.classList.add('in-check');
                
                const p = board[act];
                if (p) { sq.innerText = getPieceChar(p); sq.classList.add(p === p.toUpperCase() ? 'piece-w' : 'piece-b'); }
                sq.onclick = () => handleSquareClick(act);
                boardEl.appendChild(sq);
            }
        }

        function handleSquareClick(idx) {
            if (isGameOver || (isOnlineGame && turn !== myOnlineColor) || (gameMode === 'pvc' && turn === 'b')) return;
            const clicked = board[idx];
            if (selectedSquare !== null) {
                const move = legalMovesForSelected.find(m => m.to === idx);
                if (move) { executeMove(move); return; }
            }
            if (clicked) {
                const isW = clicked === clicked.toUpperCase();
                if ((turn === 'w' && isW) || (turn === 'b' && !isW)) {
                    selectedSquare = idx; legalMovesForSelected = getLegalMoves(idx, clicked, board, enPassantTarget);
                } else { selectedSquare = null; legalMovesForSelected = []; }
            } else { selectedSquare = null; legalMovesForSelected = []; }
            renderBoard();
        }

        function executeMove(move) {
            const isPawn = move.piece.toLowerCase() === 'p';
            const isProm = (move.piece === 'P' && Math.floor(move.to / 8) === 0) || (move.piece === 'p' && Math.floor(move.to / 8) === 7);
            if (isPawn && isProm) { pendingPromotion = move; document.getElementById('promo-modal').style.display = 'flex'; return; }
            finalizeMove(move);
        }

        function selectPromotion(type) {
            document.getElementById('promo-modal').style.display = 'none';
            if (pendingPromotion) {
                pendingPromotion.piece = pendingPromotion.piece === 'P' ? type.toUpperCase() : type.toLowerCase();
                finalizeMove(pendingPromotion); pendingPromotion = null;
            }
        }

        function finalizeMove(move) {
            history.push({ board: [...board], turn, enPassantTarget, moveNumber });
            board[move.to] = move.piece; board[move.from] = null;
            if (move.isEnPassant) board[move.piece === 'P' ? move.to + 8 : move.to - 8] = null;
            enPassantTarget = null;
            if (move.piece.toLowerCase() === 'p' && Math.abs(move.to - move.from) === 16) enPassantTarget = (move.to + move.from) / 2;

            const note = `${move.piece.toUpperCase()}${String.fromCharCode(97 + (move.from % 8))}${8 - Math.floor(move.from / 8)}-${String.fromCharCode(97 + (move.to % 8))}${8 - Math.floor(move.to / 8)}`;
            algebraicHistory.push({ from: move.from, to: move.to, notation: note });
            
            if (turn === 'b') { const li = document.createElement('li'); li.innerHTML = `<span>${moveNumber}.</span> ${note}`; moveListEl.appendChild(li); moveNumber++; }
            else {
                const last = moveListEl.lastElementChild;
                if (last) last.innerHTML += ` ${note}`;
                else { const li = document.createElement('li'); li.innerHTML = `<span>${moveNumber}.</span> ... ${note}`; moveListEl.appendChild(li); }
            }

            turn = turn === 'w' ? 'b' : 'w'; selectedSquare = null; legalMovesForSelected = [];
            renderBoard(); checkGameState();

            if (isOnlineGame && channel) channel.postMessage({ type: 'move', move: move });
            if (gameMode === 'pvc' && turn === 'b' && !isGameOver) setTimeout(makeAIMove, 300);
        }

        // --- CONTROLO DE BOTÕES COM MODAL PERSONALIZADO ---
        function askNewGame() { 
            showConfirm("Novo Jogo", "Queres mesmo começar um novo jogo? A partida atual será perdida.", false, () => {
                initBoard();
                if (isOnlineGame && channel) channel.postMessage({ type: 'reset' });
            });
        }

        function askResign() {
            if (isGameOver) return;
            showConfirm("Desistir", "Tens a certeza que queres desistir? Vais perder pontos de rank.", true, () => {
                isGameOver = true;
                const winner = turn === 'w' ? 'Pretas' : 'Brancas';
                showVictory(`Desististe. Vencedor: ${winner}`, false);
                if (isOnlineGame && channel) channel.postMessage({ type: 'resign' });
            });
        }

        function flipBoard() { isFlipped = !isFlipped; renderBoard(); }
        function toggleHistory() { document.getElementById('history-panel').classList.toggle('open'); }

        // --- IA ---
        function makeAIMove() {
            if (isGameOver) return;
            let best = null, bestScore = -Infinity;
            for (let i = 0; i < 64; i++) {
                const p = board[i];
                if (p && p === p.toLowerCase()) {
                    const moves = getLegalMoves(i, p, board, enPassantTarget);
                    for (let m of moves) {
                        const tb = [...board]; tb[m.to] = m.piece; tb[m.from] = null;
                        if (m.isEnPassant) tb[m.to - 8] = null;
                        let sc = evalBoard(tb);
                        if (isCheck('b', tb)) sc -= 50;
                        sc += Math.random() * 5;
                        if (sc > bestScore) { bestScore = sc; best = m; }
                    }
                }
            }
            if (best) executeMove(best);
        }

        function evalBoard(cb) {
            let sc = 0;
            for (let p of cb) {
                if (p) {
                    const v = pieceValues[p.toLowerCase()];
                    if (p === p.toLowerCase()) sc += v;
                    else sc -= v;
                }
            }
            return sc;
        }

        // --- VITÓRIA, PONTOS E ANIMAÇÕES ---
        function showVictory(text, isWin) {
            victoryTitle.innerText = isWin ? "VITÓRIA!" : "DERROTA";
            victoryTitle.style.color = isWin ? "var(--neon-cyan)" : "var(--danger)";
            victorySubtitle.innerText = text;
            
            victoryPts.style.display = 'none';
            let ptsGained = 0;

            if (isOnlineGame && !text.includes('Empate')) {
                if (isWin) {
                    const timeSecs = Math.floor((Date.now() - matchStartTime) / 1000);
                    if (timeSecs < 300) ptsGained = 200;
                    else if (timeSecs < 600) ptsGained = 150;
                    else if (timeSecs < 900) ptsGained = 100;
                    else ptsGained = 10; 
                    
                    setPlayerPoints(getPlayerPoints() + ptsGained);
                    victoryPts.innerText = `+ ${ptsGained} Pontos`;
                } else {
                    ptsGained = -20;
                    setPlayerPoints(getPlayerPoints() + ptsGained);
                    victoryPts.innerText = `${ptsGained} Pontos`;
                }
                victoryPts.style.display = 'block';
            }

            victoryScreen.style.display = 'flex';
            if (isWin) startFireworks();
            else startCryingEmojis();
        }

        function closeVictory() {
            victoryScreen.style.display = 'none';
            if (animationId) cancelAnimationFrame(animationId);
            initBoard();
            document.getElementById('menu-screen').style.display = 'flex';
            document.getElementById('menu-screen').style.opacity = '1';
            document.getElementById('game-container').style.display = 'none';
            if (channel) { channel.close(); channel = null; }
            updateRankUI();
        }

        function startFireworks() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let p = [];
            class Part {
                constructor(x, y, c) {
                    this.x = x; this.y = y; this.c = c;
                    const a = Math.random() * Math.PI * 2, s = Math.random() * 4 + 1;
                    this.vx = Math.cos(a) * s; this.vy = Math.sin(a) * s; this.l = 1; this.d = Math.random() * 0.015 + 0.01;
                }
                upd() { this.x += this.vx; this.y += this.vy; this.vx *= 0.96; this.vy *= 0.96; this.vy += 0.05; this.l -= this.d; }
                drw() { ctx.beginPath(); ctx.arc(this.x, this.y, 2, 0, Math.PI * 2); ctx.fillStyle = `rgba(${this.c}, ${this.l})`; ctx.fill(); }
            }
            function exp(x, y) {
                const cs = ['0, 243, 255', '184, 0, 255', '255, 255, 255'], c = cs[Math.floor(Math.random() * 3)];
                for (let i = 0; i < 50; i++) p.push(new Part(x, y, c));
            }
            function loop() {
                ctx.fillStyle = 'rgba(10, 10, 12, 0.2)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
                if (Math.random() < 0.05 && p.length < 400) exp(Math.random() * canvas.width, Math.random() * canvas.height * 0.6);
                for (let i = p.length - 1; i >= 0; i--) { p[i].upd(); p[i].drw(); if (p[i].l <= 0) p.splice(i, 1); }
                animationId = requestAnimationFrame(loop);
            }
            loop();
        }

        function startCryingEmojis() {
            const canvas = document.getElementById('fireworks-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            let p = [];
            class Emoji {
                constructor() {
                    this.x = Math.random() * canvas.width; this.y = -50;
                    this.vx = (Math.random() - 0.5) * 2; this.vy = Math.random() * 3 + 2;
                    this.sz = Math.random() * 20 + 20; this.e = ['😭', '😢', '💧', '😿'][Math.floor(Math.random() * 4)];
                    this.r = Math.random() * 360; this.rs = (Math.random() - 0.5) * 5;
                }
                upd() { this.x += this.vx; this.y += this.vy; this.r += this.rs; if (this.y > canvas.height + 50) { this.y = -50; this.x = Math.random() * canvas.width; } }
                drw() {
                    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.r * Math.PI / 180);
                    ctx.font = `${this.sz}px Arial`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                    ctx.fillText(this.e, 0, 0); ctx.restore();
                }
            }
            for (let i = 0; i < 40; i++) { let e = new Emoji(); e.y = Math.random() * canvas.height; p.push(e); }
            function loop() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let e of p) { e.upd(); e.drw(); }
                animationId = requestAnimationFrame(loop);
            }
            loop();
        }

        // --- INICIALIZAÇÃO ---
        window.addEventListener('DOMContentLoaded', () => {
            initBoard();
            loadSettings();
            updateRankUI();
        });
    </script>
