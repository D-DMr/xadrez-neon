<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Neon Chess</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♞</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0e14; --panel: #151b26; --text: #fff; --muted: #9ca3af; --accent: #10b981; --blue: #3b82f6; --danger: #ef4444; --light: #ebecd0; --dark: #779556; }
        body.light { --bg: #f8f9fa; --panel: #fff; --text: #111; --muted: #6b7280; }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; height: 100dvh; overflow: hidden; }
        
        .sidebar { width: 70px; background: var(--panel); border-right: 1px solid rgba(128,128,128,0.2); display: flex; flex-direction: column; align-items: center; padding: 20px 0; z-index: 10; }
        .nav-btn { width: 50px; height: 50px; border-radius: 12px; background: transparent; border: none; color: var(--muted); cursor: pointer; margin-bottom: 10px; font-size: 1.5rem; display: flex; justify-content: center; align-items: center; }
        .nav-btn.active, .nav-btn:hover { background: rgba(128,128,128,0.1); color: var(--text); }

        .main { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; }
        .view { display: none; width: 100%; height: 100%; overflow-y: auto; }
        .view.active { display: flex; flex-direction: column; }

        /* Dashboard */
        #v-home { padding: 40px; align-items: center; }
        .dash { display: grid; grid-template-columns: 350px 1fr; gap: 30px; width: 100%; max-width: 1100px; }
        .card { background: var(--panel); border-radius: 16px; padding: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); border: 1px solid rgba(128,128,128,0.1); }
        .avatar { width: 80px; height: 80px; border-radius: 12px; background: linear-gradient(135deg, var(--blue), var(--accent)); display: flex; justify-content: center; align-items: center; font-size: 2rem; font-weight: bold; color: #fff; }
        .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; background: var(--bg); padding: 15px; border-radius: 12px; text-align: center; margin-top: 20px; }
        .stats h4 { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
        .stats div { font-size: 1.2rem; font-weight: bold; }
        .play-btn { background: var(--panel); border: 1px solid rgba(128,128,128,0.2); border-radius: 16px; padding: 30px; text-align: center; cursor: pointer; transition: 0.2s; }
        .play-btn:hover { border-color: var(--accent); transform: translateY(-3px); }
        .play-btn h2 { font-size: 1.2rem; margin-bottom: 10px; }

        /* Game */
        #v-game { flex-direction: row; justify-content: center; }
        .game-area { display: flex; flex-direction: column; flex: 1; max-width: 800px; padding: 20px; }
        .player { display: flex; justify-content: space-between; align-items: center; background: var(--panel); padding: 10px 15px; border-radius: 8px; margin: 5px 0; border: 1px solid rgba(128,128,128,0.1); }
        .clock { font-family: monospace; font-size: 1.5rem; font-weight: bold; background: var(--bg); padding: 5px 15px; border-radius: 6px; }
        .clock.active { background: var(--accent); color: #000; }
        .board-wrap { width: 100%; aspect-ratio: 1/1; background: var(--panel); padding: 5px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        #board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; }
        .sq { display: flex; justify-content: center; align-items: center; position: relative; cursor: pointer; font-size: 9vw; }
        @media (min-width: 600px) { .sq { font-size: 50px; } }
        .sq.light { background: var(--light); color: #333; } .sq.dark { background: var(--dark); color: #333; }
        .p { filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.5)); z-index: 2; }
        .p-w { color: #fff; -webkit-text-stroke: 1px #333; } .p-b { color: #111; -webkit-text-stroke: 1px #999; }
        .hl::after { content: ''; position: absolute; width: 30%; height: 30%; background: rgba(0,0,0,0.2); border-radius: 50%; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .check { background: rgba(239, 68, 68, 0.8) !important; }
        
        /* Sidebar History */
        .history { width: 280px; background: var(--panel); border-left: 1px solid rgba(128,128,128,0.1); display: flex; flex-direction: column; flex-shrink: 0; }
        .history ul { list-style: none; flex: 1; overflow-y: auto; font-family: monospace; padding: 15px; }
        .history li { padding: 5px 0; border-bottom: 1px solid rgba(128,128,128,0.1); display: flex; gap: 10px; }
        .actions { padding: 15px; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; background: rgba(128,128,128,0.1); color: var(--text); }
        .btn.red { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .m-box { background: var(--panel); padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; }
        .m-box h2 { margin-bottom: 15px; text-align: center; }
        .m-box input, .m-box select { width: 100%; padding: 12px; background: var(--bg); border: 1px solid rgba(128,128,128,0.2); color: var(--text); border-radius: 8px; margin-bottom: 10px; outline: none; }
        .m-box button { width: 100%; padding: 15px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 5px; }
        .b-green { background: var(--accent); color: #fff; } .b-grey { background: transparent; border: 1px solid rgba(128,128,128,0.3) !important; color: var(--text); }
        #toast { position: fixed; bottom: -100px; left: 50%; transform: translateX(-50%); background: var(--accent); color: #fff; padding: 12px 25px; border-radius: 30px; font-weight: bold; transition: 0.3s; z-index: 200; }
        #toast.show { bottom: 30px; }

        @media (max-width: 850px) {
            .dash { grid-template-columns: 1fr; padding-bottom: 80px; }
            #v-game { flex-direction: column; }
            .history { position: fixed; bottom: 0; left: 0; width: 100%; height: 250px; transform: translateY(100%); transition: 0.3s; z-index: 50; }
            .history.open { transform: translateY(0); }
            .sidebar { position: fixed; bottom: 0; width: 100%; height: 60px; flex-direction: row; justify-content: space-around; padding: 0; z-index: 60; border-right: none; border-top: 1px solid rgba(128,128,128,0.1); }
            .main { height: calc(100dvh - 60px); }
            #v-home { padding: 20px; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <button class="nav-btn active" onclick="go('home', this)">🏠</button>
        <button class="nav-btn" onclick="go('game', this)">⚔️</button>
        <button class="nav-btn" onclick="go('set', this)">⚙️</button>
        <button class="nav-btn" onclick="openModal('m-admin')" style="margin-top:auto; font-size:1.2rem;">👑</button>
    </aside>

    <main class="main">
        <!-- HOME -->
        <div id="v-home" class="view active">
            <div class="dash">
                <div class="card">
                    <div style="display:flex; gap:15px; align-items:center;">
                        <div class="avatar" id="u-av">G</div>
                        <div><h2 id="u-name">Convidado</h2><p style="color:var(--muted); font-size:0.9rem;">🇵🇹 Portugal</p></div>
                    </div>
                    <div class="stats">
                        <div><h4>Rating</h4><div style="color:var(--blue)" id="u-pts">1200</div></div>
                        <div><h4>Jogos</h4><div id="u-tot">0</div></div>
                        <div><h4>Win</h4><div style="color:var(--accent)" id="u-win">0%</div></div>
                    </div>
                    <button class="btn" style="margin-top:15px; border:1px solid rgba(128,128,128,0.2);" onclick="openModal('m-login')" id="btn-login">Entrar / Registar</button>
                </div>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; align-content:start;">
                    <div class="play-btn" onclick="start('pvc')"><h2>🤖 vs IA</h2><p style="color:var(--muted); font-size:0.8rem;">Modo Casual</p></div>
                    <div class="play-btn" onclick="start('online')"><h2>🌐 Online</h2><p style="color:var(--muted); font-size:0.8rem;">Ranked</p></div>
                </div>
            </div>
        </div>

        <!-- GAME -->
        <div id="v-game" class="view">
            <div class="game-area">
                <div class="player">
                    <div style="display:flex; align-items:center; gap:10px;"><div style="font-size:1.5rem;">🤖</div><div><b id="opp-name">Oponente</b><div style="font-size:0.7rem; color:var(--muted)" id="opp-elo">---</div></div></div>
                    <div class="clock" id="c-top">10:00</div>
                </div>
                <div class="board-wrap"><div id="board"></div></div>
                <div class="player">
                    <div style="display:flex; align-items:center; gap:10px;"><div style="font-size:1.5rem;" id="my-av">G</div><div><b id="my-name">Tu</b><div style="font-size:0.7rem; color:var(--muted)" id="my-elo">1200</div></div></div>
                    <div class="clock active" id="c-bot">10:00</div>
                </div>
            </div>
            <div class="history" id="hist">
                <div style="padding:15px; font-weight:bold; display:flex; justify-content:space-between; border-bottom:1px solid rgba(128,128,128,0.1);">
                    <span>Movimentos</span><button style="background:none; border:none; color:var(--text);" onclick="document.getElementById('hist').classList.remove('open')">✖</button>
                </div>
                <ul id="moves"></ul>
                <div class="actions">
                    <button class="btn" onclick="askNew()">Novo Jogo</button>
                    <button class="btn red" onclick="askResign()">Desistir</button>
                </div>
            </div>
        </div>

        <!-- SETTINGS -->
        <div id="v-set" class="view" style="padding:40px; align-items:center;">
            <div class="card" style="width:100%; max-width:500px;">
                <h2>Definições</h2>
                <select id="set-ui" onchange="theme()" style="margin-top:15px;"><option value="dark">Site Escuro</option><option value="light">Site Claro</option></select>
                <select id="set-pc" onchange="theme()"><option value="classic">Peças Clássicas</option><option value="modern">Peças Sólidas</option><option value="letters">Letras</option></select>
                <select id="set-bd" onchange="theme()"><option value="classic">Tabuleiro Madeira</option><option value="dark">Neon Escuro</option><option value="blue">Cyberpunk</option><option value="green">Esmeralda</option></select>
            </div>
        </div>
    </main>

    <!-- MODALS -->
    <div class="modal" id="m-login"><div class="m-box"><h2>Entrar</h2><input type="email" id="i-mail" placeholder="Email"><input type="text" id="i-name" placeholder="Nome" maxlength="12"><button class="b-green" onclick="login()">Entrar</button><button class="b-grey" onclick="closeModal('m-login')">Cancelar</button></div></div>
    <div class="modal" id="m-admin"><div class="m-box"><h2>👑 Admin</h2><input type="password" id="i-pass" placeholder="Password"><button class="b-green" onclick="checkAdmin()">Entrar</button><button class="b-grey" onclick="closeModal('m-admin')">Fechar</button></div></div>
    <div class="modal" id="m-admin-panel"><div class="m-box"><h2>Gerir Pontos</h2><input type="text" id="a-search" placeholder="Nome do Jogador"><button class="b-green" onclick="findPlayer()">Procurar</button><div id="a-res" style="display:none; margin:10px 0; padding:10px; background:rgba(128,128,128,0.1); border-radius:8px;"><span id="a-name"></span>: <b id="a-pts"></b></div><input type="number" id="a-amt" placeholder="Pontos a mudar"><div style="display:flex; gap:10px;"><button class="b-green" onclick="mod('add')">Adicionar</button><button class="b-grey" style="color:var(--danger); border-color:var(--danger) !important;" onclick="mod('sub')">Remover</button></div><button class="b-grey" onclick="closeModal('m-admin-panel')">Sair</button></div></div>
    <div class="modal" id="m-confirm"><div class="m-box"><h2 id="c-title">Título</h2><p id="c-msg" style="margin-bottom:20px; color:var(--muted)">Msg</p><div style="display:flex; gap:10px;"><button class="b-grey" onclick="closeC(false)">Não</button><button class="b-green" id="c-btn" onclick="closeC(true)">Sim</button></div></div></div>
    <div class="modal" id="m-promo"><div class="m-box" style="text-align:center; font-size:3rem; display:flex; justify-content:center; gap:15px;"><div onclick="promo('q')">♕</div><div onclick="promo('r')">♖</div><div onclick="promo('b')">♗</div><div onclick="promo('n')">♘</div></div></div>
    
    <div id="toast">Msg</div>

    <script>
        // --- DB & UI ---
        const db = () => JSON.parse(localStorage.getItem('chess_db')) || {};
        const save = (d) => localStorage.setItem('chess_db', JSON.stringify(d));
        let user = localStorage.getItem('chess_user') || null;
        
        function toast(m) { const t=document.getElementById('toast'); t.innerText=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }
        function openModal(id) { document.getElementById(id).style.display='flex'; }
        function closeModal(id) { document.getElementById(id).style.display='none'; }
        function go(id, btn) { document.querySelectorAll('.view').forEach(v=>v.classList.remove('active')); document.getElementById('v-'+id).classList.add('active'); document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); if(id==='game' && board.length===0) start('pvc'); }
        
        function updateUI() {
            let name="Convidado", pts=1200, w=0, l=0;
            if(user && db()[user]) { name=db()[user].name; pts=db()[user].pts; w=db()[user].w; l=db()[user].l; }
            else { pts = parseInt(localStorage.getItem('guest_pts')||'1200'); }
            document.getElementById('u-name').innerText=name; document.getElementById('u-av').innerText=name[0].toUpperCase();
            document.getElementById('u-pts').innerText=pts;
            document.getElementById('u-tot').innerText=w+l;
            document.getElementById('u-win').innerText=(w+l>0?Math.round((w/(w+l))*100):0)+'%';
            document.getElementById('my-name').innerText=name; document.getElementById('my-av').innerText=name[0].toUpperCase();
            document.getElementById('my-elo').innerText=pts;
            if(user) document.getElementById('btn-login').innerText="Terminar Sessão";
        }

        function login() {
            const mail=document.getElementById('i-mail').value.trim().toLowerCase(), name=document.getElementById('i-name').value.trim();
            if(!mail||!name) return toast("Preenche tudo");
            const d=db(); if(!d[mail]) d[mail]={name:name,pts:1200,w:0,l:0}; else d[mail].name=name;
            save(d); user=mail; localStorage.setItem('chess_user',user); closeModal('m-login'); updateUI(); toast("Bem-vindo!");
        }

        // --- ADMIN ---
        function checkAdmin(){ if(document.getElementById('i-pass').value==='admin'){ closeModal('m-admin'); openModal('m-admin-panel'); } else toast("Erro"); }
        let targetMail=null;
        function findPlayer(){
            const s=document.getElementById('a-search').value.trim().toLowerCase(), d=db();
            for(let m in d){ if(d[m].name.toLowerCase()===s){ targetMail=m; document.getElementById('a-name').innerText=d[m].name; document.getElementById('a-pts').innerText=d[m].pts; document.getElementById('a-res').style.display='block'; return; } }
            toast("Não encontrado");
        }
        function mod(act){
            if(!targetMail) return toast("Procura primeiro");
            const amt=parseInt(document.getElementById('a-amt').value); if(!amt||amt<1) return toast("Qtd inválida");
            const d=db(); d[targetMail].pts = act==='add' ? d[targetMail].pts+amt : Math.max(0,d[targetMail].pts-amt);
            save(d); document.getElementById('a-pts').innerText=d[targetMail].pts; updateUI(); toast("Feito!");
        }

        // --- GAME ENGINE ---
        const bEl = document.getElementById('board');
        let board=[], turn='w', sel=null, moves=[], hist=[], num=1, flipped=false, mode='pvc', over=false, ep=null, pp=null;
        const initB = ['r','n','b','q','k','b','n','r','p','p','p','p','p','p','p','p',null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,'P','P','P','P','P','P','P','P','R','N','B','Q','K','B','N','R'];
        
        let wTime=600, bTime=600, timer=null;
        let chan=null, myColor=null, online=false;

        function start(m){
            mode=m; go('game', document.querySelectorAll('.nav-btn')[1]); if(timer) clearInterval(timer);
            if(m==='online'){
                online=true; document.getElementById('opp-name').innerText="À espera...";
                chan = new BroadcastChannel('neon_chess_bc'); chan.postMessage({t:'find'});
                chan.onmessage = e => {
                    if(e.data.t==='find' && !myColor){ myColor='w'; chan.postMessage({t:'found',c:'b'}); onlStart('Oponente'); }
                    else if(e.data.t==='found'){ myColor=e.data.c; onlStart('Oponente'); }
                    else if(e.data.t==='move' && online) { applyOnl(e.data.m); }
                    else if(e.data.t==='resign') { over=true; clearInterval(timer); toast("Inimigo desistiu. Ganhaste!"); updStats('w'); }
                };
            } else {
                online=false; document.getElementById('opp-name').innerText="Computador (IA)"; document.getElementById('opp-elo').innerText="1500";
                flipped=false; reset();
            }
        }
        function onlStart(name){ document.getElementById('opp-name').innerText=name; document.getElementById('opp-elo').innerText="Ranked"; if(myColor==='b') flipped=true; reset(); }
        function applyOnl(m){ board[m.t]=m.p; board[m.f]=null; turn=turn==='w'?'b':'w'; draw(); check(); updateClocks(); }

        function reset() {
            board=[...initB]; turn='w'; sel=null; moves=[]; hist=[]; num=1; ep=null; over=false; wTime=600; bTime=600;
            document.getElementById('moves').innerHTML=''; draw(); startTimer();
        }
        function startTimer() {
            if(timer) clearInterval(timer); updateClocks();
            timer=setInterval(()=>{
                if(over) return;
                if(turn==='w') wTime--; else bTime--;
                if(wTime<=0||bTime<=0){ over=true; clearInterval(timer); toast("Tempo!"); updStats(wTime<=0?'l':'w'); }
                updateClocks();
            },1000);
        }
        function updateClocks() {
            const f=t=>`${Math.floor(t/60)}:${(t%60).toString().padStart(2,'0')}`;
            const ct=document.getElementById('c-top'), cb=document.getElementById('c-bot');
            if(flipped){ ct.innerText=f(wTime); cb.innerText=f(bTime); ct.classList.toggle('active',turn==='w'); cb.classList.toggle('active',turn==='b'); }
            else { ct.innerText=f(bTime); cb.innerText=f(wTime); ct.classList.toggle('active',turn==='b'); cb.classList.toggle('active',turn==='w'); }
        }

        function getMoves(p, pc, b, e) {
            let m=[], r=Math.floor(p/8), c=p%8, w=pc===pc.toUpperCase();
            const add=(r,c)=>{ if(r>=0&&r<8&&c>=0&&c<8){ let t=r*8+c, tp=b[t]; if(!tp||(w?tp===tp.toLowerCase():tp===tp.toUpperCase())) m.push({f:p,t:t,p:pc,c:tp}); } };
            const l=pc.toLowerCase();
            if(l==='p'){ let d=w?-1:1, s=w?6:1; if(r+d>=0&&r+d<8&&!b[(r+d)*8+c]){ m.push({f:p,t:(r+d)*8+c,p:pc}); if(r===s&&!b[(r+2*d)*8+c]) m.push({f:p,t:(r+2*d)*8+c,p:pc}); } [-1,1].forEach(dc=>{ if(c+dc>=0&&c+dc<8){ let t=(r+d)*8+(c+dc); if(r+d>=0&&r+d<8){ let tp=b[t]; if(tp&&(w?tp===tp.toLowerCase():tp===tp.toUpperCase())) m.push({f:p,t:t,p:pc,c:tp}); if(t===e) m.push({f:p,t:t,p:pc,c:w?'p':'P',ep:true}); } } }); }
            else if(l==='n'){ [[-2,-1],[-2,1],[-1,-2],[-1,2],[1,-2],[1,2],[2,-1],[2,1]].forEach(([dr,dc])=>add(r+dr,c+dc)); }
            else if(l==='b'||l==='r'||l==='q'){ let dirs=[]; if(l==='b'||l==='q') dirs.push([-1,-1],[-1,1],[1,-1],[1,1]); if(l==='r'||l==='q') dirs.push([-1,0],[1,0],[0,-1],[0,1]); dirs.forEach(([dr,dc])=>{ let rr=r+dr, cc=c+dc; while(rr>=0&&rr<8&&cc>=0&&cc<8){ let t=rr*8+cc, tp=b[t]; if(!tp) m.push({f:p,t:t,p:pc}); else { if(w?tp===tp.toLowerCase():tp===tp.toUpperCase()) m.push({f:p,t:t,p:pc,c:tp}); break; } rr+=dr; cc+=dc; } }); }
            else if(l==='k'){ for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++) if(dr!==0||dc!==0) add(r+dr,c+dc); }
            return m;
        }
        function getLegal(p, pc, b, e) { return getMoves(p,pc,b,e).filter(m=>{ let tb=[...b]; tb[m.t]=pc; tb[m.f]=null; if(m.ep) tb[pc===pc.toUpperCase()?m.t+8:m.t-8]=null; return !isCheck(pc===pc.toUpperCase()?'w':'b', tb); }); }
        function isCheck(col, b) { let k=col==='w'?'K':'k', pos=b.indexOf(k); if(pos===-1) return false; let en=col==='w'?'b':'w'; for(let i=0;i<64;i++){ let p=b[i]; if(p&&(en==='w'?p===p.toUpperCase():p===p.toLowerCase())){ if(getMoves(i,p,b,null).some(m=>m.t===pos)) return true; } } return false; }
        
        function check() {
            let has=false; for(let i=0;i<64;i++){ let p=board[i]; if(p&&(turn==='w'?p===p.toUpperCase():p===p.toLowerCase())){ if(getLegal(i,p,board,ep).length>0){has=true;break;} } }
            if(!has){ over=true; clearInterval(timer); if(isCheck(turn,board)){ toast(`Xeque-Mate! Venceu: ${turn==='w'?'Pretas':'Brancas'}`); updStats(turn==='w'?'l':'w'); } else { toast("Empate"); } }
        }

        function draw() {
            bEl.innerHTML=''; let chk=!over&&isCheck(turn,board), kp=board.indexOf(turn==='w'?'K':'k');
            for(let i=0;i<64;i++){
                let act=flipped?63-i:i, r=Math.floor(act/8), c=act%8, sq=document.createElement('div');
